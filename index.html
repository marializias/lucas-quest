<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lucas Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" width="960" height="540" aria-label="Lucas Quest"></canvas>

    <div id="mobileControls" aria-label="Controles do jogo">
      <div class="dpad">
        <button data-key="arrowup" aria-label="Cima">▲</button>
        <div>
          <button data-key="arrowleft" aria-label="Esquerda">◀</button>
          <button data-key="arrowdown" aria-label="Baixo">▼</button>
          <button data-key="arrowright" aria-label="Direita">▶</button>
        </div>
      </div>

      <div class="actions">
        <button class="interact-button" data-action="interact" aria-label="Interagir"><span>✦</span><span>INTERAGIR</span></button>
        <button data-action="inventory">🎒</button>
      </div>
    </div>
      <div id="rotateHint">Vire o celular na horizontal para jogar.</div>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
